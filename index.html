<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/pokeball-png-45330.png?v=2">  
    <link rel="stylesheet" href="style.css">
    <title>DEXAI</title>
    <script defer src="script.js"></script>
    
</head>
<body>
    <main>
        <img src="#" alt="pokemon" class="pokemon_image">
        
        <h1 class="pokemon_data">
            <span class="pokemon_number"></span> -
            <span class="pokemon_name"></span>
        </h1>
        
        <form class="form">
            <input 
            type="search" 
            class="input_search" 
            placeholder="Nome ou Número" 
            required/>
        </form>

        <div class="buttons">
            <button class="button btn-prev">Anterior &lt</button>
            <button class="button btn-next">Próximo &gt    </button>
        </div>
        
        <img src="images/pokedex.png" alt="pokedex" class="pokedex">

    </main>

    <aside class="chat-panel">
        <div class="chat-header">
            <span>Pergunte à IA sobre <strong class="chat-current-pokemon">-</strong></span>
            <button type="button" class="chat-key-btn" title="Configurar chave da API do Gemini">⚙</button>
        </div>

        <div class="chat-key-setup">
            <p>
                Para usar o chat, cole sua chave gratuita da API do Gemini.
                <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Gerar chave grátis</a>
            </p>
            <div class="chat-key-row">
                <input
                    type="password"
                    class="chat-key-input"
                    placeholder="Cole sua chave aqui (AIzaSy...)"
                    autocomplete="off" />
                <button type="button" class="chat-key-save">Salvar</button>
            </div>
            <small>Sua chave fica salva só no seu navegador. Ela nunca é enviada para nenhum servidor além do Google.</small>
        </div>

        <div class="chat-messages"></div>

        <form class="chat-form">
            <input
                type="text"
                class="chat-input"
                placeholder="Ex: quais os movimentos dele?"
                autocomplete="off"
                required />
            <button type="submit" class="chat-send">Enviar</button>
        </form>
    </aside>
</body>
</html>
